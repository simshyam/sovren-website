<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sovren - Portfolio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Dhurjati&family=Raleway:wght@200;300;400;700;800;900&family=Manrope:wght@200;300;400;500;600&display=swap');

:root {
--black: #07070a;
--white: #eeeee8;
--lavender: #c7a8ff;
--purple: #3f00ac;
--purple-mid: #7b3fd4;
--accent-dim: rgba(199, 168, 255, 0.08);
--border: rgba(199,168,255,0.08);
--muted: #1e1428;
--card-bg: #0f0a1a;
--card-bg-hover: #160d24;
--grey-text: #b8b0c8;
--grey-dark: #4a4460;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
background: var(--black);
color: var(--white);
font-family: 'Manrope', sans-serif;
font-weight: 300;
overflow-x: hidden;
}

a { color: inherit; }

nav {
position: fixed;
top: 0; left: 0; right: 0;
z-index: 100;
display: flex;
align-items: center;
justify-content: space-between;
padding: 28px 60px;
background: rgba(7,7,10,0.88);
backdrop-filter: blur(12px);
border-bottom: 1px solid var(--border);
}

.nav-left { display: flex; align-items: center; gap: 22px; }
.nav-logo { display: flex; align-items: center; gap: 14px; text-decoration: none; }
.nav-wordmark { font-family: 'Dhurjati', sans-serif; font-weight: 400; font-size: 34px; letter-spacing: 0.28em; text-transform: uppercase; background: linear-gradient(90deg, #c7a8ff, #3f00ac); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

.hamburger { width: 30px; height: 22px; display: flex; flex-direction: column; justify-content: space-between; background: none; border: none; cursor: pointer; padding: 0; z-index: 210; }
.hamburger span { display: block; width: 100%; height: 2px; background: var(--white); border-radius: 1px; transition: transform 0.25s ease, opacity 0.2s ease; }
.hamburger.open span:nth-child(1) { transform: translateY(10px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-10px) rotate(-45deg); }

.nav-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 190; }
.nav-overlay.open { opacity: 1; pointer-events: auto; }

.nav-menu { position: fixed; top: 0; left: 0; height: 100vh; width: 300px; max-width: 82vw; background: var(--card-bg); border-right: 1px solid var(--border); padding: 110px 44px 44px; display: flex; flex-direction: column; transform: translateX(-100%); transition: transform 0.32s ease; z-index: 200; }
.nav-menu.open { transform: translateX(0); }
.nav-menu a { font-family: 'Manrope', sans-serif; font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--grey-text); text-decoration: none; padding: 20px 0; border-bottom: 1px solid var(--border); transition: color 0.2s; }
.nav-menu a:hover { color: var(--lavender); }

.nav-cta { font-family: 'Manrope', sans-serif; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--white); background: #6c32d0; border: none; padding: 12px 28px; cursor: pointer; transition: opacity 0.2s; font-weight: 500; text-decoration: none; display: inline-block; }
.nav-cta:hover { opacity: 0.85; }
@media (max-width: 480px) {
  nav { padding: 22px 20px; }
  .nav-cta { padding: 10px 18px; font-size: 10px; }
}

.hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 140px 40px 100px; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 60px 60px; mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%); pointer-events: none; }
.hero-eyebrow { font-size: 10px; letter-spacing: 0.45em; text-transform: uppercase; color: var(--lavender); margin-bottom: 32px; font-weight: 700; opacity: 0; animation: fadeUp 0.8s 0.2s forwards; }
.hero-title { font-family: 'Raleway', sans-serif; font-weight: 900; font-size: clamp(52px, 8vw, 110px); letter-spacing: 0.12em; text-transform: uppercase; line-height: 0.95; color: var(--white); opacity: 0; animation: fadeUp 0.8s 0.35s forwards; }
.hero-title span { background: linear-gradient(90deg, var(--lavender), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero-tag { margin-top: 26px; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--grey-text); opacity: 0; animation: fadeUp 0.8s 0.45s forwards; }
.hero-sub { margin-top: 20px; max-width: 520px; font-size: 15px; line-height: 1.9; color: var(--grey-text); font-weight: 400; opacity: 0; animation: fadeUp 0.8s 0.5s forwards; }
.hero-actions { margin-top: 52px; display: flex; gap: 16px; opacity: 0; animation: fadeUp 0.8s 0.65s forwards; }
.btn-solid { font-family: 'Manrope', sans-serif; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--white); background: #6c32d0; border: none; padding: 16px 36px; cursor: pointer; transition: opacity 0.2s; font-weight: 500; text-decoration: none; }
.btn-solid:hover { opacity: 0.85; }
.btn-ghost { font-family: 'Manrope', sans-serif; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--lavender); background: transparent; border: 1px solid rgba(199,168,255,0.25); padding: 16px 36px; cursor: pointer; transition: border-color 0.2s, color 0.2s; font-weight: 400; text-decoration: none; }
.btn-ghost:hover { border-color: var(--lavender); color: var(--white); }

section { border-top: 1px solid var(--border); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 72px 60px; }
.section-header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 40px; }
.modules-label { text-align: center; font-size: 9px; letter-spacing: 0.45em; text-transform: uppercase; color: var(--lavender); margin-bottom: 20px; }
.section-label { font-size: 9px; letter-spacing: 0.45em; text-transform: uppercase; color: var(--lavender); margin-bottom: 20px; }
.section-title { font-family: 'Raleway', sans-serif; font-weight: 800; font-size: 36px; letter-spacing: 0.06em; color: var(--white); }
.section-sub { margin-top: 20px; max-width: 640px; font-size: 14px; line-height: 1.9; color: var(--grey-text); font-weight: 400; }

.modules-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; }
.module-card { background: var(--card-bg); border: 1px solid rgba(199,168,255,0.1); padding: 40px 32px; transition: background 0.3s, border-color 0.3s; }
.module-card:hover { background: var(--card-bg-hover); border-color: rgba(199,168,255,0.35); }
.module-num { font-family: 'Raleway', sans-serif; font-weight: 900; font-size: 11px; letter-spacing: 0.3em; color: var(--lavender); margin-bottom: 20px; opacity: 0.7; }
.module-title { font-family: 'Raleway', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.06em; color: var(--white); margin-bottom: 14px; }
.module-body { font-size: 13px; line-height: 1.9; color: var(--grey-text); font-weight: 400; }
.modules-cta { display: flex; justify-content: center; margin-top: 36px; }

.toolkit-wrap { overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.toolkit-track { display: flex; gap: 56px; width: max-content; animation: scroll 30s linear infinite; align-items: center; }
.toolkit-track span { font-family: 'Raleway', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 0.04em; color: var(--grey-text); white-space: nowrap; }
@keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

.functions-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
.function-card { background: var(--card-bg); border: 1px solid rgba(199,168,255,0.1); padding: 40px 30px; position: relative; transition: background 0.3s, border-color 0.3s; cursor: default; flex: 1 1 240px; max-width: 268px; }
.function-card:hover { background: var(--card-bg-hover); border-color: rgba(199,168,255,0.35); }
.fn-number { font-family: 'Raleway', sans-serif; font-weight: 900; font-size: 12px; letter-spacing: 0.2em; color: var(--lavender); margin-bottom: 18px; opacity: 0.8; }
.fn-title { font-family: 'Raleway', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.06em; color: var(--white); margin-bottom: 14px; text-transform: uppercase; }
.fn-body { font-size: 12.5px; line-height: 1.85; color: var(--grey-text); font-weight: 400; }
@media (max-width: 560px) { .function-card { flex-basis: 100%; max-width: 340px; } }

@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

footer { border-top: 1px solid var(--border); padding: 40px 60px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
.footer-wordmark { font-family: 'Dhurjati', sans-serif; font-weight: 400; font-size: 18px; letter-spacing: 0.28em; text-transform: uppercase; background: linear-gradient(90deg, #c7a8ff, #3f00ac); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.footer-links { display: flex; gap: 28px; }
.footer-links a { font-size: 11px; color: var(--grey-text); text-decoration: none; letter-spacing: 0.05em; }
.footer-links a:hover { color: var(--lavender); }
.footer-copy { font-size: 11px; color: var(--grey-dark); letter-spacing: 0.1em; }

@media (max-width: 768px) {
nav { padding: 20px 24px; }
.hero { padding: 120px 24px 80px; }
.wrap { padding: 56px 24px; }
footer { flex-direction: column; gap: 12px; text-align: center; padding: 32px 24px; }
}
@media (max-width: 420px) {
.modules-grid { grid-template-columns: 1fr; }
}

.page-hero { padding: 160px 60px 60px; text-align: center; border-top: none; }
.page-eyebrow { font-size: 10px; letter-spacing: 0.45em; text-transform: uppercase; color: var(--lavender); margin-bottom: 20px; font-weight: 700; }
.page-title { font-family: 'Raleway', sans-serif; font-weight: 900; font-size: clamp(36px, 5vw, 60px); letter-spacing: 0.06em; color: var(--white); text-transform: uppercase; }
.page-sub { margin: 24px auto 0; max-width: 640px; font-size: 15px; line-height: 1.9; color: var(--grey-text); }

/* case studies accordion */
.cs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.cs-card { background: var(--card-bg); border: 1px solid rgba(199,168,255,0.1); padding: 36px 30px; text-align: left; cursor: pointer; transition: background 0.3s, border-color 0.3s; display: flex; flex-direction: column; align-items: flex-start; font-family: inherit; width: 100%; box-sizing: border-box; outline: none; }
.cs-card:hover { background: var(--card-bg-hover); border-color: rgba(199,168,255,0.35); }
.cs-card:focus-visible { border-color: var(--lavender); }
.cs-card h3 { font-family: 'Raleway', sans-serif; font-weight: 700; font-size: 16px; color: var(--white); margin-bottom: 12px; line-height: 1.35; }
.cs-card p { font-size: 13px; line-height: 1.75; color: var(--grey-text); }
.cs-card-divider { width: 100%; border-top: 1px solid var(--border); margin: 18px 0 14px; }
.cs-card-outcome-label { font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--lavender); margin-bottom: 8px; font-weight: 700; }
.cs-card p.cs-card-outcome { font-size: 13px; line-height: 1.7; color: var(--white); }
@media (max-width: 900px) { .cs-grid { grid-template-columns: 1fr; } }

.cs-icon { display: inline-block; width: 14px; height: 14px; margin-bottom: 18px; flex-shrink: 0; background: var(--shape-color); }
.shape-circle { border-radius: 50%; }
.shape-diamond { transform: rotate(45deg); }
.shape-triangle { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 14px solid var(--shape-color); background: none !important; }
.shape-plus { position: relative; background: none !important; }
.shape-plus::before, .shape-plus::after { content: ''; position: absolute; background: var(--shape-color); }
.shape-plus::before { left: 6px; top: 0; width: 2px; height: 14px; }
.shape-plus::after { left: 0; top: 6px; width: 14px; height: 2px; }

.cs-expanded-panel { background: var(--card-bg); border: 1px solid rgba(199,168,255,0.2); padding: 48px 44px; margin-bottom: 2px; position: relative; }
.cs-expanded-close { position: absolute; top: 28px; right: 28px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(199,168,255,0.25); background: transparent; color: var(--grey-text); cursor: pointer; font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center; transition: border-color 0.2s, color 0.2s; outline: none; }
.cs-expanded-close:hover, .cs-expanded-close:focus-visible { border-color: var(--lavender); color: var(--white); }
.cs-expanded-header { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
.cs-expanded-header .cs-icon { margin-bottom: 0; width: 16px; height: 16px; }
.cs-expanded-title { font-family: 'Raleway', sans-serif; font-weight: 800; font-size: 24px; color: var(--white); letter-spacing: 0.02em; padding-right: 40px; }
.cs-expanded-problem { font-size: 14px; line-height: 1.8; color: var(--grey-text); max-width: 700px; margin: 14px 0 28px 30px; }
.cs-divider { border-top: 1px solid var(--border); margin: 0 0 28px; }
.cs-expanded-label { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--lavender); margin-bottom: 10px; font-weight: 700; }
.cs-expanded-block { margin-bottom: 28px; max-width: 760px; margin-left: 30px; }
.cs-expanded-block:last-child { margin-bottom: 0; }
.cs-expanded-block p { font-size: 14.5px; line-height: 1.9; color: var(--white); }
.cs-expanded-block.overview p { color: var(--grey-text); }

.cs-pills { display: flex; flex-wrap: wrap; gap: 2px; }
.cs-pill { background: var(--card-bg); border: 1px solid rgba(199,168,255,0.1); padding: 16px 20px; display: flex; align-items: center; gap: 14px; cursor: pointer; font-family: 'Raleway', sans-serif; font-size: 13px; font-weight: 600; color: var(--white); transition: background 0.3s, border-color 0.3s; flex: 1 1 220px; outline: none; }
.cs-pill:hover, .cs-pill:focus-visible { background: var(--card-bg-hover); border-color: rgba(199,168,255,0.35); }
.cs-pill .plus { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(199,168,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--lavender); flex-shrink: 0; }
@media (max-width: 560px) { .cs-expanded-panel { padding: 40px 24px; } .cs-expanded-problem, .cs-expanded-block { margin-left: 0; } }
</style>
</head>
<body>

<nav>
<div class="nav-left">
<button class="hamburger" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false">
<span></span><span></span><span></span>
</button>
<a class="nav-logo" href="index.html"><img src="sovren-logo-light.png" alt="Sovren Consulting" style="height:46px;"/></a>
</div>
<a class="nav-cta" href="https://forms.gle/vsA7gLc9hSPCap3MA" target="_blank" rel="noopener noreferrer">Book a Consult</a>
</nav>
<div class="nav-overlay" id="navOverlay"></div>
<div class="nav-menu" id="navMenu">
<a href="who-we-are.html">Who We Are</a>
<a href="portfolio.html">Portfolio</a>
</div>

<section class="page-hero">
<p class="page-eyebrow">Portfolio</p>
<h1 class="page-title">Case Studies</h1>
<p class="page-sub">A look into the administrative projects we've worked on, and how it's helped our clients operate better. Click a card to see the full engagement.</p>
</section>

<section id="portfolio-hub">
<div class="wrap">
<div id="csRoot"></div>
</div>
</section>

<footer id="book-consult">
<img src="sovren-logo-light.png" alt="Sovren Consulting" style="height:36px;"/>
<div class="footer-links">
<a href="who-we-are.html">Who We Are</a>
<a href="portfolio.html">Portfolio</a>
<a href="privacy.html">Privacy Policy &amp; Terms</a>
</div>
<span class="footer-copy">© 2026 Sovren. All rights reserved.</span>
</footer>

<script>
const hamburgerBtn = document.getElementById('hamburgerBtn');
const navMenu = document.getElementById('navMenu');
const navOverlay = document.getElementById('navOverlay');
function closeMenu() {
  navMenu.classList.remove('open');
  hamburgerBtn.classList.remove('open');
  navOverlay.classList.remove('open');
  hamburgerBtn.setAttribute('aria-expanded', 'false');
}
function toggleMenu() {
  const isOpen = navMenu.classList.toggle('open');
  hamburgerBtn.classList.toggle('open', isOpen);
  navOverlay.classList.toggle('open', isOpen);
  hamburgerBtn.setAttribute('aria-expanded', String(isOpen));
}
hamburgerBtn.addEventListener('click', toggleMenu);
navOverlay.addEventListener('click', closeMenu);
navMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));

const caseStudies = [
  {
    title: 'Shopify-to-GL Reconciliation',
    problem: 'Reconciling Shopify sales to the general ledger meant manually matching every order against revenue entries by hand, every period.',
    outcome: 'Monthly reconciliation dropped from ~10 hours to a single review step.',
    overview: 'We built a microapp that pulls period-specific Shopify sales and automatically buckets them against ERP GL entries, splitting recorded revenue, unearned revenue, returns, and other categories so the merchant sees exactly how their Shopify numbers map to their books.'
  },
  {
    title: 'Automated Ticket Creation',
    problem: 'Support agents spent hours a day transcribing calls and formatting tickets by hand.',
    outcome: 'Ticket creation time cut by ~80%, reclaiming 20+ hours a week.',
    overview: 'We integrated a transcription tool into the support workflow that turns live call notes and inbound emails into fully formatted ticket submissions, complete with automated follow-ups and status updates. Agents review and submit instead of write from scratch.'
  },
  {
    title: 'Automated Royalties Reporting',
    problem: 'Tracking royalties per transaction meant pulling data and building reports from scratch every cycle.',
    outcome: 'Royalties reporting went from hours of manual compilation to a single automated pull.',
    overview: "We built a microapp connected to the merchant's system of record that tracks royalties at the transaction level and generates custom reports on demand. No spreadsheet assembly, no manual cross-referencing."
  },
  {
    title: 'Calendar and Task Management Agent',
    problem: 'A founder managing 7-8 meetings a day tracked bookings, reschedules, and follow-ups on a notepad, with no assistant or system.',
    outcome: '365+ hours of calendar admin returned to the founder annually.',
    overview: "We built a voice-to-text agent connected to Google Calendar that lets the founder speak naturally to book, reschedule, or cancel meetings. The same agent pulls follow-up tasks from recorded calls and maintains a structured weekly backlog, giving the founder a consistent operating rhythm for the first time."
  },
  {
    title: 'Expense Processing Automation',
    problem: 'Every expense passed through four manual steps, from organizing documents to chasing treasury for payment, before it hit the books.',
    outcome: '~15 hours/month of manual expense processing eliminated end to end.',
    overview: "We built an agent that replicates the full expense workflow: capturing incoming documents, logging them to the tracker, updating status in real time, and sending payment reminders to treasury on schedule. Human involvement only kicks in at the approval layer."
  },
  {
    title: 'Social Media Content Workflow',
    problem: 'A solo founder spent hours on ideation and writing for every post, creating everything from scratch.',
    outcome: 'Content creation time cut by ~5 hours a week.',
    overview: "We built an AI-powered content workflow that takes the founder's raw input (voice recordings, session notes, topic ideas) and produces formatted, on-brand content on command. The founder's voice and expertise drive the output; the system handles structure, SEO relevance, and multi-format repurposing."
  },
  {
    title: 'Shopify Store Build and Launch',
    problem: 'A D2C founder ready to launch who wanted the infrastructure built right from day one.',
    outcome: 'Went from zero to a fully operational storefront, ready before the first order came in.',
    overview: "We built the full commercial foundation end to end: storefront, email marketing, pre-launch social campaigns, shipping, and the operational backbone behind it so the founder could make informed decisions on purchasing, demand, and growth from the start. Every system was connected and ready to scale before the first sale, not retrofitted after."
  }
];

const shapeClasses = ['shape-circle', 'shape-square', 'shape-diamond', 'shape-triangle', 'shape-plus'];
function shapeClass(i) { return shapeClasses[i % shapeClasses.length]; }
function shapeColor(i) { return i % 2 === 0 ? 'var(--lavender)' : 'var(--purple-mid)'; }

const csRoot = document.getElementById('csRoot');
let expandedIndex = null;

function cardHTML(cs, i) {
  return `<button class="cs-card" type="button" data-index="${i}">
<span class="cs-icon ${shapeClass(i)}" style="--shape-color:${shapeColor(i)}"></span>
<h3>${cs.title}</h3>
<p>${cs.problem}</p>
<div class="cs-card-divider"></div>
<p class="cs-card-outcome-label">Outcome</p>
<p class="cs-card-outcome">${cs.outcome}</p>
</button>`;
}

function pillHTML(cs, i) {
  return `<button class="cs-pill" type="button" data-index="${i}"><span class="plus">+</span>${cs.title}</button>`;
}

function renderCaseStudies() {
  if (expandedIndex === null) {
    csRoot.innerHTML = `<div class="cs-grid">${caseStudies.map((cs, i) => cardHTML(cs, i)).join('')}</div>`;
    csRoot.querySelectorAll('.cs-card').forEach(el => el.addEventListener('click', () => {
      expandedIndex = parseInt(el.dataset.index, 10);
      renderCaseStudies();
    }));
  } else {
    const cs = caseStudies[expandedIndex];
    const others = caseStudies.map((c, i) => ({ c, i })).filter(o => o.i !== expandedIndex);
    csRoot.innerHTML = `
<div class="cs-expanded-panel">
<button class="cs-expanded-close" type="button" aria-label="Close case study">&times;</button>
<div class="cs-expanded-header">
<span class="cs-icon ${shapeClass(expandedIndex)}" style="--shape-color:${shapeColor(expandedIndex)}"></span>
<h3 class="cs-expanded-title">${cs.title}</h3>
</div>
<p class="cs-expanded-problem">${cs.problem}</p>
<div class="cs-divider"></div>
<div class="cs-expanded-block">
<p class="cs-expanded-label">Outcome</p>
<p>${cs.outcome}</p>
</div>
<div class="cs-expanded-block overview">
<p class="cs-expanded-label">Project Overview</p>
<p>${cs.overview}</p>
</div>
</div>
<div class="cs-pills">${others.map(o => pillHTML(o.c, o.i)).join('')}</div>`;
    csRoot.querySelector('.cs-expanded-close').addEventListener('click', () => {
      expandedIndex = null;
      renderCaseStudies();
    });
    csRoot.querySelectorAll('.cs-pill').forEach(el => el.addEventListener('click', () => {
      expandedIndex = parseInt(el.dataset.index, 10);
      renderCaseStudies();
    }));
  }
}

renderCaseStudies();
</script>

</body>
</html>
